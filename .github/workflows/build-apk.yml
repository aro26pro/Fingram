name: Fingram Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Fingram project
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)
          unzip -q "$ZIP" -d source

      - name: Find Android project
        run: |
          APP_DIR=$(find source -type d -name android | head -1)
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Android project: $APP_DIR"

      - name: Build APK
        run: |
          cd "$APP_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fingram-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
