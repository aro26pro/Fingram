name: Fingram Android Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract existing Fingram Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="fingram_release_ready_v15.zip"
          test -f "$ZIP" || { echo "Missing $ZIP"; exit 1; }
          mkdir -p source
          unzip -q "$ZIP" -d source
          APP_DIR=$(find source -type f -path '*/android/settings.gradle' -printf '%h\n' | head -n 1)
          test -n "$APP_DIR" || { echo "Android project not found in $ZIP"; exit 1; }
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Android project: $APP_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          gradle assembleDebug --no-daemon -PfingramUrlOverride=https://aro26pro.pythonanywhere.com/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fingram-debug-apk
          if-no-files-found: error
          path: source/**/android/app/build/outputs/apk/debug/*.apk
