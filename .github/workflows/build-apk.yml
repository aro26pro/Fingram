name: Fingram Android Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Fingram Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="fingram_release_ready_v15.zip"
          test -f "$ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          APP_DIR=$(find source -type f -path '*/android/settings.gradle' -printf '%h\n' | head -n 1)
          test -n "$APP_DIR" || { echo "Android project not found"; exit 1; }
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Correct legacy Fingram Gradle configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["APP_DIR"]) / "app" / "build.gradle"
          s = p.read_text()
          lines = s.splitlines()
          lines = [line for line in lines if not ("buildConfigField" in line and "FINGRAM_URL" in line)]
          s = "\n".join(lines) + "\n"
          target = "    defaultConfig {"
          if target not in s:
              raise SystemExit("Missing defaultConfig block")
          field = """        buildConfigField 'String', 'FINGRAM_URL', '"https://aro26pro.pythonanywhere.com/"'"""
          s = s.replace(target, target + "\n" + field, 1)
          p.write_text(s)
          print("FINGRAM_URL configured with a literal HTTPS URL")
          PY

      - name: Fix checked exception in Android update flow
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["APP_DIR"]) / "app/src/main/java/com/fingram/app/MainActivity.java"
          s = p.read_text()
          call = "appUpdateManager.startUpdateFlowForResult(info, AppUpdateType.FLEXIBLE, this, UPDATE_REQUEST_CODE);"
          n = s.count(call)
          if n != 2:
              raise SystemExit(f"Expected two update calls, found {n}")
          replacement = """try {
                      appUpdateManager.startUpdateFlowForResult(info, AppUpdateType.FLEXIBLE, this, UPDATE_REQUEST_CODE);
                  } catch (android.content.IntentSender.SendIntentException e) {
                      android.util.Log.w("Fingram", "Unable to start in-app update", e);
                  }"""
          s = s.replace(call, replacement)
          p.write_text(s)
          print("Handled SendIntentException in both update flows")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fingram-debug-apk
          if-no-files-found: error
          path: source/**/android/app/build/outputs/apk/debug/*.apk
